<svg viewBox="0 0 980 560" width="980" height="560" xmlns="http://www.w3.org/2000/svg" font-family="'Comic Sans MS','Segoe UI',sans-serif">
  <rect x="0" y="0" width="980" height="560" fill="#15151c"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff4d6d"/>
    </marker>
  </defs>

  <!-- You -->
  <g>
    <circle cx="80" cy="110" r="42" fill="#2a2a35" stroke="#ff4d6d" stroke-width="3"/>
    <text x="80" y="104" text-anchor="middle" font-size="26" fill="#fff">🧑</text>
    <text x="80" y="165" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">You</text>
    <text x="80" y="180" text-anchor="middle" font-size="11" fill="#aaa">log a bet 🎫</text>
  </g>

  <!-- Browser -->
  <rect x="190" y="60" width="190" height="100" rx="18" fill="#1b2a3a" stroke="#4da3ff" stroke-width="3"/>
  <text x="285" y="100" text-anchor="middle" font-size="24" fill="#fff">🖥️</text>
  <text x="285" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Browser</text>
  <text x="285" y="144" text-anchor="middle" font-size="11" fill="#aaa">index.html / watch.html</text>

  <!-- Server -->
  <rect x="440" y="60" width="200" height="100" rx="18" fill="#241b3a" stroke="#b07bff" stroke-width="3"/>
  <text x="540" y="100" text-anchor="middle" font-size="24" fill="#fff">⚙️</text>
  <text x="540" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">FastAPI Server</text>
  <text x="540" y="144" text-anchor="middle" font-size="11" fill="#aaa">app.py · port 8212</text>

  <!-- DB -->
  <g>
    <ellipse cx="840" cy="80" rx="95" ry="22" fill="#2a1a1a" stroke="#ff4d6d" stroke-width="3"/>
    <rect x="745" y="80" width="190" height="60" fill="#2a1a1a" stroke="#ff4d6d" stroke-width="3"/>
    <ellipse cx="840" cy="140" rx="95" ry="22" fill="#2a1a1a" stroke="#ff4d6d" stroke-width="3"/>
    <text x="840" y="86" text-anchor="middle" font-size="20" fill="#fff">💾</text>
    <text x="840" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">SQLite .db</text>
    <text x="840" y="155" text-anchor="middle" font-size="11" fill="#aaa">ufc-bet-tracker-v3.db</text>
  </g>

  <!-- Arrows: You -> Browser -->
  <path d="M123,105 C150,95 165,95 188,100" fill="none" stroke="#ff4d6d" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Browser <-> Server -->
  <path d="M382,95 C405,92 418,92 438,95" fill="none" stroke="#ff4d6d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M438,125 C418,128 405,128 382,125" fill="none" stroke="#ff4d6d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="408" y="82" text-anchor="middle" font-size="11" font-style="italic" fill="#bbb">POST /api/bets</text>
  <text x="408" y="150" text-anchor="middle" font-size="11" font-style="italic" fill="#bbb">JSON back</text>

  <!-- Server <-> DB -->
  <path d="M642,95 C680,88 705,88 743,92" fill="none" stroke="#ff4d6d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M743,128 C705,132 680,132 642,125" fill="none" stroke="#ff4d6d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="692" y="78" text-anchor="middle" font-size="11" font-style="italic" fill="#bbb">INSERT row</text>
  <text x="692" y="150" text-anchor="middle" font-size="11" font-style="italic" fill="#bbb">committed ✅</text>

  <!-- callout -->
  <rect x="190" y="195" width="650" height="48" rx="12" fill="#1c1c24" stroke="#444"/>
  <text x="515" y="223" text-anchor="middle" font-size="12" fill="#ddd">💡 No local-storage magic — every bet writes straight to the .db file before you see it. Refresh = truth.</text>

  <!-- divider -->
  <line x1="40" y1="275" x2="940" y2="275" stroke="#333" stroke-dasharray="6,6"/>
  <text x="40" y="300" font-size="14" font-weight="700" fill="#fff">🔧 When you change the code...</text>

  <!-- repo -->
  <g>
    <rect x="40" y="330" width="180" height="90" rx="18" fill="#1a2a1f" stroke="#5ad17c" stroke-width="3"/>
    <text x="130" y="365" text-anchor="middle" font-size="24" fill="#fff">📝</text>
    <text x="130" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Edit repo files</text>
    <text x="130" y="405" text-anchor="middle" font-size="11" fill="#aaa">v3/app.py, static/*</text>
  </g>

  <path d="M222,375 C250,375 260,375 285,375" fill="none" stroke="#ff4d6d" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- decision diamond -->
  <polygon points="365,330 475,375 365,420 255,375" fill="#2a251a" stroke="#f0c050" stroke-width="3"/>
  <text x="365" y="365" text-anchor="middle" font-size="22" fill="#fff">🤔</text>
  <text x="365" y="395" text-anchor="middle" font-size="11" fill="#eee">frontend</text>
  <text x="365" y="408" text-anchor="middle" font-size="11" fill="#eee">or backend?</text>

  <!-- frontend path -->
  <path d="M475,350 C540,320 600,310 650,320" fill="none" stroke="#4da3ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="560" y="303" text-anchor="middle" font-size="11" font-style="italic" fill="#4da3ff">static HTML/JS/CSS</text>
  <rect x="650" y="300" width="260" height="60" rx="18" fill="#1b2a3a" stroke="#4da3ff" stroke-width="3"/>
  <text x="780" y="325" text-anchor="middle" font-size="18" fill="#fff">🔄</text>
  <text x="780" y="348" text-anchor="middle" font-size="11" fill="#ddd">just hard-refresh the browser</text>

  <!-- backend path -->
  <path d="M475,400 C540,430 600,440 650,435" fill="none" stroke="#b07bff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="560" y="455" text-anchor="middle" font-size="11" font-style="italic" fill="#b07bff">app.py / db.py / schema</text>
  <rect x="650" y="405" width="260" height="60" rx="18" fill="#241b3a" stroke="#b07bff" stroke-width="3"/>
  <text x="780" y="430" text-anchor="middle" font-size="18" fill="#fff">♻️</text>
  <text x="780" y="453" text-anchor="middle" font-size="11" fill="#ddd">systemctl restart service</text>

  <!-- both paths converge to DB-safe note -->
  <path d="M780,360 C780,420 780,460 780,488" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <rect x="650" y="490" width="260" height="55" rx="12" fill="#2a1a1a" stroke="#ff4d6d" stroke-width="2"/>
  <text x="780" y="512" text-anchor="middle" font-size="16" fill="#fff">🔒💾</text>
  <text x="780" y="533" text-anchor="middle" font-size="11" fill="#ddd">your .db file is never touched</text>
</svg>
